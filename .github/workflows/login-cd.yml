name: Login Frontend CD

on:
  workflow_run:
    workflows:
      - Login Frontend CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: login-frontend-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/grape-login-frontend

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    outputs:
      image: ${{ steps.image.outputs.full_image }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set deployment image
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail

          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAG="${{ github.event.workflow_run.head_sha }}"

          echo "full_image=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "Deployment image: ${IMAGE}:${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.event.workflow_run.head_sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    needs:
      - build-and-push

    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -Eeuo pipefail

          echo "Checking SSH configuration..."

          if [ -z "${SSH_HOST:-}" ]; then
            echo "ERROR: PROD_SSH_HOST is empty."
            exit 1
          fi

          if [ -z "${SSH_PORT:-}" ]; then
            echo "ERROR: PROD_SSH_PORT is empty."
            exit 1
          fi

          if [ -z "${SSH_USER:-}" ]; then
            echo "ERROR: PROD_SSH_USER is empty."
            exit 1
          fi

          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "ERROR: PROD_SSH_PRIVATE_KEY is empty."
            exit 1
          fi

          echo "SSH Host secret exists."
          echo "SSH Port: $SSH_PORT"
          echo "SSH User secret exists."

          install -m 700 -d "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          echo "Checking private key..."

          if ! ssh-keygen -y \
            -f "$HOME/.ssh/id_ed25519" \
            > /dev/null; then

            echo "ERROR: SSH private key is invalid."
            exit 1
          fi

          echo "Private key OK."

          echo "Scanning SSH server host key..."

          if ! ssh-keyscan \
            -T 10 \
            -p "$SSH_PORT" \
            -H "$SSH_HOST" \
            > "$HOME/.ssh/known_hosts"; then

            echo "ERROR: ssh-keyscan failed."
            echo "Check PROD_SSH_HOST, PROD_SSH_PORT and router port forwarding."
            exit 1
          fi

          chmod 600 "$HOME/.ssh/known_hosts"

          echo "SSH host key scan OK."

          echo "Testing SSH connection..."

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "echo 'SSH connection OK'"

      - name: Deploy login frontend
        shell: bash
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          DEPLOY_IMAGE: ${{ needs.build-and-push.outputs.image }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          set -Eeuo pipefail

          echo "Deploy image from GitHub: $DEPLOY_IMAGE"

          if [ -z "${DEPLOY_IMAGE:-}" ]; then
            echo "ERROR: DEPLOY_IMAGE is empty."
            exit 1
          fi

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "DEPLOY_IMAGE='$DEPLOY_IMAGE' \
             GHCR_USERNAME='$GHCR_USERNAME' \
             GHCR_TOKEN='$GHCR_TOKEN' \
             bash -s" <<'REMOTE'

          set -Eeuo pipefail

          echo "Received deploy image: $DEPLOY_IMAGE"

          if [ -z "${DEPLOY_IMAGE:-}" ]; then
            echo "ERROR: DEPLOY_IMAGE was not received."
            exit 1
          fi

          cd /svc/grape

          echo "Logging in to GHCR..."

          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io \
              --username "$GHCR_USERNAME" \
              --password-stdin

          export LOGIN_FRONTEND_IMAGE="$DEPLOY_IMAGE"

          echo "Login frontend image:"
          echo "$LOGIN_FRONTEND_IMAGE"

          echo "Pulling login frontend..."
          docker compose pull login-frontend

          echo "Starting login frontend..."
          docker compose up -d --no-deps login-frontend

          echo "Running image:"
          docker inspect \
            grape-login-frontend \
            --format='{{.Config.Image}}'

          echo "Waiting for health check..."

          for attempt in $(seq 1 20); do

            STATUS="$(
              docker inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                grape-login-frontend \
                2>/dev/null \
                || echo "not-found"
            )"

            echo "Health check ${attempt}/20: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              echo "Login frontend deployment succeeded."
              docker compose ps login-frontend
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ] \
              || [ "$STATUS" = "exited" ] \
              || [ "$STATUS" = "dead" ]; then

              echo "ERROR: Login frontend deployment failed."

              docker compose ps login-frontend || true
              docker compose logs --tail=100 login-frontend || true

              exit 1
            fi

            sleep 3
          done

          echo "ERROR: Login frontend health check timed out."

          docker compose ps login-frontend || true
          docker compose logs --tail=100 login-frontend || true

          exit 1

          REMOTE