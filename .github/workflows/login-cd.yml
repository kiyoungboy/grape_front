name: Login Frontend CD

on:
  workflow_run:
    workflows:
      - Login Frontend CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: login-frontend-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/grape-login-frontend

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
      
    outputs:
      image: ${{ steps.image.outputs.full_image }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set deployment image
        id: image
        shell: bash
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAG="${{ github.event.workflow_run.head_sha }}"

          echo "full_image=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.event.workflow_run.head_sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    name: Deploy to Production
    needs:
      - build-and-push

    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy login frontend
        shell: bash
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          DEPLOY_IMAGE: ${{ needs.build-and-push.outputs.image }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          set -Eeuo pipefail

          echo "Deploy image from GitHub: $DEPLOY_IMAGE"

          if [ -z "${DEPLOY_IMAGE:-}" ]; then
            echo "ERROR: DEPLOY_IMAGE is empty."
            exit 1
          fi

          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "DEPLOY_IMAGE='$DEPLOY_IMAGE' \
            GHCR_USERNAME='$GHCR_USERNAME' \
            GHCR_TOKEN='$GHCR_TOKEN' \
            bash -s" <<'REMOTE'

          set -Eeuo pipefail

          echo "Received deploy image: $DEPLOY_IMAGE"

          if [ -z "${DEPLOY_IMAGE:-}" ]; then
            echo "ERROR: DEPLOY_IMAGE was not received."
            exit 1
          fi

          cd /svc/grape

          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io \
              --username "$GHCR_USERNAME" \
              --password-stdin

          export LOGIN_FRONTEND_IMAGE="$DEPLOY_IMAGE"

          echo "Resolved Docker Compose images:"
          docker compose config --images

          echo "Pulling login frontend..."
          docker compose pull login-frontend

          echo "Starting login frontend..."
          docker compose up -d --no-deps login-frontend

          echo "Running login image:"
          docker inspect grape-login-frontend \
            --format='{{.Config.Image}}'

          for attempt in $(seq 1 20); do
            STATUS="$(
              docker inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                grape-login-frontend 2>/dev/null \
                || echo "not-found"
            )"

            echo "Health check ${attempt}/20: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              echo "Login frontend deployment succeeded."
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ] \
              || [ "$STATUS" = "exited" ] \
              || [ "$STATUS" = "dead" ] \
              || [ "$STATUS" = "not-found" ]; then
              echo "ERROR: Login frontend deployment failed."
              docker compose ps login-frontend || true
              docker compose logs --tail=100 login-frontend || true
              exit 1
            fi

            sleep 3
          done

          echo "ERROR: Login frontend health check timed out."
          docker compose ps login-frontend || true
          docker compose logs --tail=100 login-frontend || true
          exit 1

          REMOTE